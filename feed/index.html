<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingpin Social Feed</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../src/feed.js" defer></script>
</head>
<body>
    <header class="flex flex-row justify-evenly items-center p-4 h-20 bg-white border-b border-brand">
        <!--Mobile header-->
        <div class="flex flex-row justify-between w-full items-center md:hidden">
            <div class="flex flex-row items-center justify-evenly w-full max-w-md">
                <img src="../images/crown.png">
                <h1 class="text-3xl lg:text-4xl text-brand font-bold font-playfair">Kingpin.social</h1>
            </div>
            <button id="menubarIcon">
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke-width="1.5" 
                    stroke="currentColor" 
                    class="size-10"
                    >

                    <path 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" 
                    />
                </svg>
            </button>
        </div>

        <!--Dropdown navbar for mobile-->
        <nav 
            id="dropdownNavbar"
            class="hidden flex-col bg-white border-l p-2 absolute top-0 right-0 items-center justify-evenly w-full max-w-50 h-full z-50"
            >
            <button 
                id="closeNavbar"
                class="w-fit p-2 text-xl absolute right-1 top-1 font-bold hover:text-red-500 text-stroke cursor-pointer"
            >X</button>
            <a href="#" class="underline text-brand font-bold text-lg lg:text-xl xl:text-2xl">Feed</a>
            <a href="#" class="hover:font-bold hover:text-brand hover:underline text-lg lg:text-xl xl:text-2xl">Posts</a>
            <a href="#" class="hover:font-bold hover:text-brand hover:underline text-lg lg:text-xl xl:text-2xl">Friends</a>
                
            <!--Toggle for dark mode-->
            <button 
                id="mobileMode"
                class="hover:text-brand"
                >
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke-width="1.5" 
                    stroke="currentColor" 
                    class="size-8"
                >
                    <path 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 
                            6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 
                            12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 
                            3.75 0 0 1 7.5 0Z" 
                    />
                </svg>
            </button>

            <!--Logout icon-->
            <button
                id="mobileLogout"
                class="hover:text-red-500"
                >
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke-width="1.5" 
                    stroke="currentColor" 
                    class="size-8"
                >
                    <path 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 
                            3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 
                            2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 
                            0 3-3m0 0-3-3m3 3H9" 
                    />
                </svg>
            </button>
        </nav>

        <!--Desktop header-->
        <div class="w-full hidden md:block">
            <nav class="flex flex-row justify-between items-center">
                <div class="flex flex-row items-center justify-evenly w-full max-w-md">
                    <img src="../images/crown.png">
                    <h1 class="text-3xl lg:text-4xl text-brand font-bold font-playfair">Kingpin.social</h1>
                </div>
                <div class="w-full max-w-lg flex flex-row justify-evenly">
                    <a href="#" class="underline text-brand font-bold text-lg lg:text-xl xl:text-2xl">Feed</a>
                    <a href="#" class="hover:font-bold hover:text-brand hover:underline text-lg lg:text-xl xl:text-2xl">Posts</a>
                    <a href="#" class="hover:font-bold hover:text-brand hover:underline text-lg lg:text-xl xl:text-2xl">Friends</a>

                    <!--Toggle for dark mode-->
                    <button 
                        id="desktopMode"
                        class="hover:text-brand cursor-pointer"
                        >
                        <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            fill="none" 
                            viewBox="0 0 24 24" 
                            stroke-width="1.5" 
                            stroke="currentColor" 
                            class="size-8"
                        >
                            <path 
                                stroke-linecap="round" 
                                stroke-linejoin="round" 
                                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 
                                    6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 
                                    12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 
                                    3.75 0 0 1 7.5 0Z" 
                            />
                        </svg>
                    </button>

                    <!--Logout icon-->
                    <button
                        id="desktopLogout"
                        class="hover:text-red-500 cursor-pointer"
                        >
                        <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            fill="none" 
                            viewBox="0 0 24 24" 
                            stroke-width="1.5" 
                            stroke="currentColor" 
                            class="size-8"
                        >
                            <path 
                                stroke-linecap="round" 
                                stroke-linejoin="round" 
                                d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 
                                    3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 
                                    2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 
                                    0 3-3m0 0-3-3m3 3H9" 
                            />
                        </svg>
                    </button> 
                </div>
            </nav>
        </div>
    </header>
</body>
</html>
